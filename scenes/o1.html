    <link href="../styles.css" rel="stylesheet"/>
  </head>

  <body>
    <div id="script"></div>

      var e_content = eurydice.document.getElementById("script");
      var o_content = document.getElementById("script");
      
      document.addEventListener("keydown", line);
      document.addEventListener("click", line)

      var i = 0;

      function line(e) {  // eurydice proceeds w keypresses

        o_content.innerHTML += o_lines[i];
        o_content.innerHTML += "<br>"
        e_content.innerHTML += e_lines[i];
        e_content.innerHTML += "<br>"
        i+=1;
      }

      var o_lines = [
        "<i>It is your wedding day.</i>",

        "<i>Music plays.</i>",

        "<h1>ORPHEUS</h1> For better or worse.",

      ]
